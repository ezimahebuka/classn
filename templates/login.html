<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#20292c" />
    <title>Roundcube Webmail</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
    <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
  </head>
  <body>
    <main class="login-page">
      <section class="login-panel" aria-label="Demo webmail sign in">
        <svg
          class="brand-mark"
          viewBox="0 0 100 100"
          role="img"
          aria-label="Roundcube-inspired mark"
        >
          <path class="mark-shadow" d="M8 43 49 20l42 23v33L49 99 8 76z" />
          <path class="mark-blue" d="m49 54 42-24v43L49 99z" />
          <path class="mark-side" d="M8 43 49 66v33L8 76z" />
          <path
            class="mark-orb"
            d="M50 8c18 0 32 14 32 32 0 17-13 25-33 36C30 65 18 57 18 40 18 22 32 8 50 8Z"
          />
          <path
            class="mark-orb-light"
            d="M50 8c18 0 32 14 32 32 0 17-13 25-33 36-1-1-2-1-3-2V9c1-.6 3-1 4-1Z"
          />
        </svg>

        <form class="login-form" action="{{ url_for('login') }}" method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

          <label class="input-row">
            <span class="input-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path
                  d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm0 2c-4 0-7 2-7 4.5V21h14v-2.5c0-2.5-3-4.5-7-4.5Z"
                />
              </svg>
            </span>
            <span class="visually-hidden">Username</span>
            <input
              name="username"
              type="text"
              placeholder="Username"
              autocomplete="off"
              maxlength="128"
              required
              autofocus
            />
          </label>

          <label class="input-row">
            <span class="input-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path
                  d="M18 9h-1V7a5 5 0 0 0-10 0v2H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2ZM9 7a3 3 0 0 1 6 0v2H9V7Zm4 9.7V19h-2v-2.3a2 2 0 1 1 2 0Z"
                />
              </svg>
            </span>
            <span class="visually-hidden">Password</span>
            <input
              name="password"
              type="password"
              placeholder="Password"
              autocomplete="off"
              maxlength="128"
              required
            />
          </label>

          <button class="login-button" type="submit">LOGIN</button>
        </form>

        <p class="brand-caption">Roundcube Webmail</p>
        <div class="feedback" aria-live="polite" aria-atomic="true">
          {% for category, message in get_flashed_messages(with_categories=true)
          %}
          <p class="feedback-message {{ category }}">{{ message }}</p>
          {% endfor %}
        </div>
      </section>
    </main>
    <div
      class="loading-toast"
      role="status"
      aria-live="polite"
      aria-hidden="true"
    >
      <span class="loading-spinner" aria-hidden="true"></span>
      <span>Loading...</span>
    </div>
  </body>
</html>
