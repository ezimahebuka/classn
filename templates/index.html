<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 Not Found</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
        color: #3c3d40;
        background: #fff;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-width: 280px;
        min-height: 100%;
        margin: 0;
      }

      body {
        min-height: 100vh;
        min-height: 100svh;
      }

      main {
        display: flex;
        min-height: 100vh;
        min-height: 100svh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 32px 20px 48px;
        text-align: center;
      }

      h1 {
        margin: 0;
        font-size: clamp(10rem, 34vw, 17rem);
        font-weight: 700;
        line-height: 0.85;
      }

      h2 {
        margin: 64px 0 30px;
        font-size: clamp(2rem, 7vw, 3.25rem);
        line-height: 1.1;
      }

      p {
        max-width: 100%;
        margin: 0;
        color: #72777b;
        font-size: clamp(1rem, 3vw, 1.5rem);
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>404</h1>
      <h2>Not Found</h2>
      <p>The resource requested could not be found on this server.</p>
    </main>
  </body>
</html>
